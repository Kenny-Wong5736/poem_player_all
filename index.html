<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#607b69"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>古诗朗读 V5.1</title><style>*{box-sizing:border-box}body{margin:0;color:#24352d;background:#e8eee8;font-family:"Microsoft YaHei","微软雅黑","PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC",sans-serif}.bg{position:fixed;inset:0;background:center/cover no-repeat;transition:.35s}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#fff8e6aa,#e7eee5df)}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:#fffdf2d8;backdrop-filter:blur(12px)}button,input,select{border:1px solid #ffffffaa;background:#fffdf5ee;border-radius:14px;min-height:44px;padding:8px 12px;font:15px inherit}h1{font-size:19px;margin:0}.search{margin-left:auto;width:min(390px,38vw)}main{position:relative;z-index:2;display:grid;place-items:center;padding:10px}.card{width:min(820px,100%);min-height:620px;padding:24px;border-radius:28px;background:#fffdf1dc;backdrop-filter:blur(11px);box-shadow:0 16px 45px #263a2d38;text-align:center;display:flex;flex-direction:column}.title{font-size:35px;margin:10px 0 4px}.meta{color:#8a5e3b}.poem{margin:auto;white-space:pre-line;font-size:25px;line-height:2;letter-spacing:1px}.bar{width:100%;accent-color:#607b69}.times{display:flex;align-items:center;gap:8px;font-size:13px}.controls{display:flex;gap:8px}.controls button{flex:1}.primary{background:#607b69;color:#fff}.small{font-size:13px;color:#637068}.overlay{display:none;position:fixed;inset:0;background:#0005;z-index:8}.overlay.on{display:block}.panel{position:fixed;z-index:9;background:#fffdf6f8;box-shadow:0 12px 40px #0004;backdrop-filter:blur(14px)}.drawer{left:0;top:0;bottom:0;width:min(400px,92vw);padding:18px;transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column}.drawer.on{transform:none}.settings{right:12px;top:76px;width:min(330px,92vw);padding:18px;border-radius:20px;display:none}.settings.on{display:block}.list{overflow:auto}.group{margin:12px 0 5px;color:#607b69;font-weight:bold}.item{display:block;width:100%;text-align:left;border:0;background:transparent}.item.active{background:#607b69;color:#fff}.setting{display:flex;justify-content:space-between;align-items:center;margin:12px 0}@media(max-width:650px){header{flex-wrap:wrap}.search{order:3;width:100%;margin:0}main{padding:5px 8px}.card{min-height:calc(100dvh - 120px);padding:18px 12px}.title{font-size:29px}.poem{font-size:clamp(20px,5.8vw,25px);line-height:1.9}.controls button{min-height:48px}}</style></head><body><div id="bg" class="bg"></div><header><button id="menu">☰ 目录</button><h1>古诗朗读 V5.1</h1><input id="search" class="search" placeholder="搜索诗名、作者或诗句"><button id="gear">⚙ 设置</button></header><main><section class="card"><div id="count" class="small"></div><h2 id="title" class="title"></h2><div id="meta" class="meta"></div><div id="poem" class="poem"></div><div class="times"><span id="now">00:00</span><input id="progress" class="bar" type="range" min="0" max="100" value="0"><span id="dur">00:00</span></div><div class="controls"><button id="prev">上一首</button><button id="play" class="primary">▶ 播放</button><button id="next">下一首</button></div><div id="status" class="small">首次请点击播放。之后可测试锁屏和后台播放。</div></section></main><audio id="audio" preload="auto" playsinline webkit-playsinline></audio><div id="cover" class="overlay"></div><aside id="drawer" class="panel drawer"><h2>75首古诗目录</h2><input id="dsearch" placeholder="搜索诗名、作者或诗句"><nav id="list" class="list"></nav></aside><aside id="settings" class="panel settings"><h2>播放设置</h2><label class="setting"><span>列表循环</span><input id="listLoop" type="checkbox" checked></label><label class="setting"><span>单首循环</span><input id="oneLoop" type="checkbox"></label><label class="setting"><span>语速</span><select id="rate"><option value=".75">0.75×</option><option value=".9">0.90×</option><option value="1" selected>1.00×</option><option value="1.1">1.10×</option><option value="1.25">1.25×</option></select></label><button id="done">完成</button></aside><script>const poems=[{"section": "第一册目录", "title": "江南", "dynasty": "汉", "author": "汉乐府", "text": "江南可采莲，莲叶何田田。\n鱼戏莲叶间。\n鱼戏莲叶东，鱼戏莲叶西，\n鱼戏莲叶南，鱼戏莲叶北。", "audio": "audio/01.mp3", "background": "backgrounds/01.jpg"}, {"section": "第一册目录", "title": "古朗月行（节选）", "dynasty": "唐", "author": "李白", "text": "小时不识月，呼作白玉盘。\n又疑瑶台镜，飞在青云端。", "audio": "audio/02.mp3", "background": "backgrounds/02.jpg"}, {"section": "第一册目录", "title": "赠汪伦", "dynasty": "唐", "author": "李白", "text": "李白乘舟将欲行，忽闻岸上踏歌声。\n桃花潭水深千尺，不及汪伦送我情。", "audio": "audio/03.mp3", "background": "backgrounds/03.jpg"}, {"section": "第一册目录", "title": "静夜思", "dynasty": "唐", "author": "李白", "text": "床前明月光，疑是地上霜。\n举头望明月，低头思故乡。", "audio": "audio/04.mp3", "background": "backgrounds/04.jpg"}, {"section": "第一册目录", "title": "寻隐者不遇", "dynasty": "唐", "author": "贾岛", "text": "松下问童子，言师采药去。\n只在此山中，云深不知处。", "audio": "audio/05.mp3", "background": "backgrounds/05.jpg"}, {"section": "第一册目录", "title": "凉州词", "dynasty": "唐", "author": "王之涣", "text": "黄河远上白云间，一片孤城万仞山。\n羌笛何须怨杨柳，春风不度玉门关。", "audio": "audio/06.mp3", "background": "backgrounds/06.jpg"}, {"section": "第一册目录", "title": "夏日绝句", "dynasty": "宋", "author": "李清照", "text": "生当作人杰，死亦为鬼雄。\n至今思项羽，不肯过江东。", "audio": "audio/07.mp3", "background": "backgrounds/07.jpg"}, {"section": "第一册目录", "title": "别董大", "dynasty": "唐", "author": "高适", "text": "千里黄云白日曛，北风吹雁雪纷纷。\n莫愁前路无知己，天下谁人不识君。", "audio": "audio/08.mp3", "background": "backgrounds/08.jpg"}, {"section": "第一册目录", "title": "芙蓉楼送辛渐", "dynasty": "唐", "author": "王昌龄", "text": "寒雨连江夜入吴，平明送客楚山孤。\n洛阳亲友如相问，一片冰心在玉壶。", "audio": "audio/09.mp3", "background": "backgrounds/09.jpg"}, {"section": "第一册目录", "title": "塞下曲", "dynasty": "唐", "author": "卢纶", "text": "月黑雁飞高，单于夜遁逃。\n欲将轻骑逐，大雪满弓刀。", "audio": "audio/10.mp3", "background": "backgrounds/10.jpg"}, {"section": "第一册目录", "title": "墨梅", "dynasty": "元", "author": "王冕", "text": "我家洗砚池头树，朵朵花开淡墨痕。\n不要人夸好颜色，只留清气满乾坤。", "audio": "audio/11.mp3", "background": "backgrounds/11.jpg"}, {"section": "第一册目录", "title": "示儿", "dynasty": "宋", "author": "陆游", "text": "死去元知万事空，但悲不见九州同。\n王师北定中原日，家祭无忘告乃翁。", "audio": "audio/12.mp3", "background": "backgrounds/12.jpg"}, {"section": "第一册目录", "title": "己亥杂诗", "dynasty": "清", "author": "龚自珍", "text": "九州生气恃风雷，万马齐喑究可哀。\n我劝天公重抖擞，不拘一格降人才。", "audio": "audio/13.mp3", "background": "backgrounds/13.jpg"}, {"section": "第一册目录", "title": "游子吟", "dynasty": "唐", "author": "孟郊", "text": "慈母手中线，游子身上衣。\n临行密密缝，意恐迟迟归。\n谁言寸草心，报得三春晖。", "audio": "audio/14.mp3", "background": "backgrounds/14.jpg"}, {"section": "第一册目录", "title": "秋夜将晓出篱门迎凉有感", "dynasty": "宋", "author": "陆游", "text": "三万里河东入海，五千仞岳上摩天。\n遗民泪尽胡尘里，南望王师又一年。", "audio": "audio/15.mp3", "background": "backgrounds/15.jpg"}, {"section": "第一册目录", "title": "回乡偶书", "dynasty": "唐", "author": "贺知章", "text": "少小离家老大回，乡音无改鬓毛衰。\n儿童相见不相识，笑问客从何处来。", "audio": "audio/16.mp3", "background": "backgrounds/16.jpg"}, {"section": "第一册目录", "title": "江南春", "dynasty": "唐", "author": "杜牧", "text": "千里莺啼绿映红，水村山郭酒旗风。\n南朝四百八十寺，多少楼台烟雨中。", "audio": "audio/17.mp3", "background": "backgrounds/17.jpg"}, {"section": "第一册目录", "title": "书湖阴先生壁", "dynasty": "宋", "author": "王安石", "text": "茅檐长扫净无苔，花木成畦手自栽。\n一水护田将绿绕，两山排闼送青来。", "audio": "audio/18.mp3", "background": "backgrounds/18.jpg"}, {"section": "第一册目录", "title": "游园不值", "dynasty": "宋", "author": "叶绍翁", "text": "应怜屐齿印苍苔，小扣柴扉久不开。\n春色满园关不住，一枝红杏出墙来。", "audio": "audio/19.mp3", "background": "backgrounds/19.jpg"}, {"section": "第二册目录", "title": "登鹳雀楼", "dynasty": "唐", "author": "王之涣", "text": "白日依山尽，黄河入海流。\n欲穷千里目，更上一层楼。", "audio": "audio/20.mp3", "background": "backgrounds/20.jpg"}, {"section": "第二册目录", "title": "晓出净慈寺送林子方", "dynasty": "宋", "author": "杨万里", "text": "毕竟西湖六月中，风光不与四时同。\n接天莲叶无穷碧，映日荷花别样红。", "audio": "audio/21.mp3", "background": "backgrounds/21.jpg"}, {"section": "第二册目录", "title": "望天门山", "dynasty": "唐", "author": "李白", "text": "天门中断楚江开，碧水东流至此回。\n两岸青山相对出，孤帆一片日边来。", "audio": "audio/22.mp3", "background": "backgrounds/22.jpg"}, {"section": "第二册目录", "title": "饮湖上初晴后雨", "dynasty": "宋", "author": "苏轼", "text": "水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。", "audio": "audio/23.mp3", "background": "backgrounds/23.jpg"}, {"section": "第二册目录", "title": "望洞庭", "dynasty": "唐", "author": "刘禹锡", "text": "湖光秋月两相和，潭面无风镜未磨。\n遥望洞庭山水翠，白银盘里一青螺。", "audio": "audio/24.mp3", "background": "backgrounds/24.jpg"}, {"section": "第二册目录", "title": "早发白帝城", "dynasty": "唐", "author": "李白", "text": "朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。", "audio": "audio/25.mp3", "background": "backgrounds/25.jpg"}, {"section": "第二册目录", "title": "三衢道中", "dynasty": "宋", "author": "曾几", "text": "梅子黄时日日晴，小溪泛尽却山行。\n绿阴不减来时路，添得黄鹂四五声。", "audio": "audio/26.mp3", "background": "backgrounds/26.jpg"}, {"section": "第二册目录", "title": "忆江南", "dynasty": "唐", "author": "白居易", "text": "江南好，风景旧曾谙。\n日出江花红胜火，春来江水绿如蓝。\n能不忆江南？", "audio": "audio/27.mp3", "background": "backgrounds/27.jpg"}, {"section": "第二册目录", "title": "滁州西涧", "dynasty": "唐", "author": "韦应物", "text": "独怜幽草涧边生，上有黄鹂深树鸣。\n春潮带雨晚来急，野渡无人舟自横。", "audio": "audio/28.mp3", "background": "backgrounds/28.jpg"}, {"section": "第二册目录", "title": "题西林壁", "dynasty": "宋", "author": "苏轼", "text": "横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。", "audio": "audio/29.mp3", "background": "backgrounds/29.jpg"}, {"section": "第二册目录", "title": "出塞", "dynasty": "唐", "author": "王昌龄", "text": "秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。", "audio": "audio/30.mp3", "background": "backgrounds/30.jpg"}, {"section": "第二册目录", "title": "江畔独步寻花", "dynasty": "唐", "author": "杜甫", "text": "黄师塔前江水东，春光懒困倚微风。\n桃花一簇开无主，可爱深红爱浅红？", "audio": "audio/31.mp3", "background": "backgrounds/31.jpg"}, {"section": "第二册目录", "title": "题临安邸", "dynasty": "宋", "author": "林升", "text": "山外青山楼外楼，西湖歌舞几时休？\n暖风熏得游人醉，直把杭州作汴州。", "audio": "audio/32.mp3", "background": "backgrounds/32.jpg"}, {"section": "第二册目录", "title": "枫桥夜泊", "dynasty": "唐", "author": "张继", "text": "月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。", "audio": "audio/33.mp3", "background": "backgrounds/33.jpg"}, {"section": "第二册目录", "title": "凉州词", "dynasty": "唐", "author": "王翰", "text": "葡萄美酒夜光杯，欲饮琵琶马上催。\n醉卧沙场君莫笑，古来征战几人回？", "audio": "audio/34.mp3", "background": "backgrounds/34.jpg"}, {"section": "第二册目录", "title": "黄鹤楼送孟浩然之广陵", "dynasty": "唐", "author": "李白", "text": "故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。", "audio": "audio/35.mp3", "background": "backgrounds/35.jpg"}, {"section": "第二册目录", "title": "送元二使安西", "dynasty": "唐", "author": "王维", "text": "渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。", "audio": "audio/36.mp3", "background": "backgrounds/36.jpg"}, {"section": "第二册目录", "title": "春夜喜雨", "dynasty": "唐", "author": "杜甫", "text": "好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。", "audio": "audio/37.mp3", "background": "backgrounds/37.jpg"}, {"section": "第二册目录", "title": "泊船瓜洲", "dynasty": "宋", "author": "王安石", "text": "京口瓜洲一水间，钟山只隔数重山。\n春风又绿江南岸，明月何时照我还。", "audio": "audio/38.mp3", "background": "backgrounds/38.jpg"}, {"section": "第三册目录", "title": "咏鹅", "dynasty": "唐", "author": "骆宾王", "text": "鹅，鹅，鹅，曲项向天歌。\n白毛浮绿水，红掌拨清波。", "audio": "audio/39.mp3", "background": "backgrounds/39.jpg"}, {"section": "第三册目录", "title": "风", "dynasty": "唐", "author": "李峤", "text": "解落三秋叶，能开二月花。\n过江千尺浪，入竹万竿斜。", "audio": "audio/40.mp3", "background": "backgrounds/40.jpg"}, {"section": "第三册目录", "title": "春晓", "dynasty": "唐", "author": "孟浩然", "text": "春眠不觉晓，处处闻啼鸟。\n夜来风雨声，花落知多少。", "audio": "audio/41.mp3", "background": "backgrounds/41.jpg"}, {"section": "第三册目录", "title": "望庐山瀑布", "dynasty": "唐", "author": "李白", "text": "日照香炉生紫烟，遥看瀑布挂前川。\n飞流直下三千尺，疑是银河落九天。", "audio": "audio/42.mp3", "background": "backgrounds/42.jpg"}, {"section": "第三册目录", "title": "咏柳", "dynasty": "唐", "author": "贺知章", "text": "碧玉妆成一树高，万条垂下绿丝绦。\n不知细叶谁裁出，二月春风似剪刀。", "audio": "audio/43.mp3", "background": "backgrounds/43.jpg"}, {"section": "第三册目录", "title": "赋得古原草送别（节选）", "dynasty": "唐", "author": "白居易", "text": "离离原上草，一岁一枯荣。\n野火烧不尽，春风吹又生。", "audio": "audio/44.mp3", "background": "backgrounds/44.jpg"}, {"section": "第三册目录", "title": "绝句（迟日江山丽）", "dynasty": "唐", "author": "杜甫", "text": "迟日江山丽，春风花草香。\n泥融飞燕子，沙暖睡鸳鸯。", "audio": "audio/45.mp3", "background": "backgrounds/45.jpg"}, {"section": "第三册目录", "title": "山行", "dynasty": "唐", "author": "杜牧", "text": "远上寒山石径斜，白云生处有人家。\n停车坐爱枫林晚，霜叶红于二月花。", "audio": "audio/46.mp3", "background": "backgrounds/46.jpg"}, {"section": "第三册目录", "title": "绝句（两个黄鹂鸣翠柳）", "dynasty": "唐", "author": "杜甫", "text": "两个黄鹂鸣翠柳，一行白鹭上青天。\n窗含西岭千秋雪，门泊东吴万里船。", "audio": "audio/47.mp3", "background": "backgrounds/47.jpg"}, {"section": "第三册目录", "title": "惠崇春江晚景", "dynasty": "宋", "author": "苏轼", "text": "竹外桃花三两枝，春江水暖鸭先知。\n蒌蒿满地芦芽短，正是河豚欲上时。", "audio": "audio/48.mp3", "background": "backgrounds/48.jpg"}, {"section": "第三册目录", "title": "鹿柴", "dynasty": "唐", "author": "王维", "text": "空山不见人，但闻人语响。\n返景入深林，复照青苔上。", "audio": "audio/49.mp3", "background": "backgrounds/49.jpg"}, {"section": "第三册目录", "title": "蜂", "dynasty": "唐", "author": "罗隐", "text": "不论平地与山尖，无限风光尽被占。\n采得百花成蜜后，为谁辛苦为谁甜？", "audio": "audio/50.mp3", "background": "backgrounds/50.jpg"}, {"section": "第三册目录", "title": "观书有感（其一）", "dynasty": "宋", "author": "朱熹", "text": "半亩方塘一鉴开，天光云影共徘徊。\n问渠那得清如许？为有源头活水来。", "audio": "audio/51.mp3", "background": "backgrounds/51.jpg"}, {"section": "第三册目录", "title": "六月二十七日望湖楼醉书", "dynasty": "宋", "author": "苏轼", "text": "黑云翻墨未遮山，白雨跳珠乱入船。\n卷地风来忽吹散，望湖楼下水如天。", "audio": "audio/52.mp3", "background": "backgrounds/52.jpg"}, {"section": "第三册目录", "title": "春日", "dynasty": "宋", "author": "朱熹", "text": "胜日寻芳泗水滨，无边光景一时新。\n等闲识得东风面，万紫千红总是春。", "audio": "audio/53.mp3", "background": "backgrounds/53.jpg"}, {"section": "第三册目录", "title": "浪淘沙（其一）", "dynasty": "唐", "author": "刘禹锡", "text": "九曲黄河万里沙，浪淘风簸自天涯。\n如今直上银河去，同到牵牛织女家。", "audio": "audio/54.mp3", "background": "backgrounds/54.jpg"}, {"section": "第三册目录", "title": "石灰吟", "dynasty": "明", "author": "于谦", "text": "千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。", "audio": "audio/55.mp3", "background": "backgrounds/55.jpg"}, {"section": "第三册目录", "title": "竹石", "dynasty": "清", "author": "郑燮", "text": "咬定青山不放松，立根原在破岩中。\n千磨万击还坚劲，任尔东西南北风。", "audio": "audio/56.mp3", "background": "backgrounds/56.jpg"}, {"section": "第三册目录", "title": "早春呈水部张十八员外", "dynasty": "唐", "author": "韩愈", "text": "天街小雨润如酥，草色遥看近却无。\n最是一年春好处，绝胜烟柳满皇都。\n、朝代、作者与全文。目录顺序与选篇范围依据用户提供的三张目录图片。另参\n考百度文库的75首目录用于作者与朝代交叉核对。\n”等。本合集采用在线来源所列通行版本，并对图片明确标注的《古朗月行（节\n选）》与《赋得古原草送别（节选）》保留节选。", "audio": "audio/57.mp3", "background": "backgrounds/57.jpg"}, {"section": "第四册目录", "title": "悯农（其二）", "dynasty": "唐", "author": "李绅", "text": "锄禾日当午，汗滴禾下土。\n谁知盘中餐，粒粒皆辛苦。", "audio": "audio/58.mp3", "background": "backgrounds/58.jpg"}, {"section": "第四册目录", "title": "池上", "dynasty": "唐", "author": "白居易", "text": "小娃撑小艇，偷采白莲回。\n不解藏踪迹，浮萍一道开。", "audio": "audio/59.mp3", "background": "backgrounds/59.jpg"}, {"section": "第四册目录", "title": "小池", "dynasty": "宋", "author": "杨万里", "text": "泉眼无声惜细流，树阴照水爱晴柔。\n小荷才露尖尖角，早有蜻蜓立上头。", "audio": "audio/60.mp3", "background": "backgrounds/60.jpg"}, {"section": "第四册目录", "title": "小儿垂钓", "dynasty": "唐", "author": "胡令能", "text": "蓬头稚子学垂纶，侧坐莓苔草映身。\n路人借问遥招手，怕得鱼惊不应人。", "audio": "audio/61.mp3", "background": "backgrounds/61.jpg"}, {"section": "第四册目录", "title": "江雪", "dynasty": "唐", "author": "柳宗元", "text": "千山鸟飞绝，万径人踪灭。\n孤舟蓑笠翁，独钓寒江雪。", "audio": "audio/62.mp3", "background": "backgrounds/62.jpg"}, {"section": "第四册目录", "title": "敕勒歌", "dynasty": "北朝", "author": "北朝民歌", "text": "敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，风吹草低见牛羊。", "audio": "audio/63.mp3", "background": "backgrounds/63.jpg"}, {"section": "第四册目录", "title": "村居", "dynasty": "清", "author": "高鼎", "text": "草长莺飞二月天，拂堤杨柳醉春烟。\n儿童散学归来早，忙趁东风放纸鸢。", "audio": "audio/64.mp3", "background": "backgrounds/64.jpg"}, {"section": "第四册目录", "title": "悯农（其一）", "dynasty": "唐", "author": "李绅", "text": "春种一粒粟，秋收万颗子。\n四海无闲田，农夫犹饿死。", "audio": "audio/65.mp3", "background": "backgrounds/65.jpg"}, {"section": "第四册目录", "title": "所见", "dynasty": "清", "author": "袁枚", "text": "牧童骑黄牛，歌声振林樾。\n意欲捕鸣蝉，忽然闭口立。", "audio": "audio/66.mp3", "background": "backgrounds/66.jpg"}, {"section": "第四册目录", "title": "元日", "dynasty": "宋", "author": "王安石", "text": "爆竹声中一岁除，春风送暖入屠苏。\n千门万户曈曈日，总把新桃换旧符。", "audio": "audio/67.mp3", "background": "backgrounds/67.jpg"}, {"section": "第四册目录", "title": "清明", "dynasty": "唐", "author": "杜牧", "text": "清明时节雨纷纷，路上行人欲断魂。\n借问酒家何处有？牧童遥指杏花村。", "audio": "audio/68.mp3", "background": "backgrounds/68.jpg"}, {"section": "第四册目录", "title": "九月九日忆山东兄弟", "dynasty": "唐", "author": "王维", "text": "独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。", "audio": "audio/69.mp3", "background": "backgrounds/69.jpg"}, {"section": "第四册目录", "title": "四时田园杂兴（其二十五）", "dynasty": "宋", "author": "范成大", "text": "梅子金黄杏子肥，麦花雪白菜花稀。\n日长篱落无人过，惟有蜻蜓蛱蝶飞。", "audio": "audio/70.mp3", "background": "backgrounds/70.jpg"}, {"section": "第四册目录", "title": "渔歌子", "dynasty": "唐", "author": "张志和", "text": "西塞山前白鹭飞，桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，斜风细雨不须归。", "audio": "audio/71.mp3", "background": "backgrounds/71.jpg"}, {"section": "第四册目录", "title": "四时田园杂兴（其三十一）", "dynasty": "宋", "author": "范成大", "text": "昼出耘田夜绩麻，村庄儿女各当家。\n童孙未解供耕织，也傍桑阴学种瓜。", "audio": "audio/72.mp3", "background": "backgrounds/72.jpg"}, {"section": "第四册目录", "title": "乡村四月", "dynasty": "宋", "author": "翁卷", "text": "绿遍山原白满川，子规声里雨如烟。\n乡村四月闲人少，才了蚕桑又插田。", "audio": "audio/73.mp3", "background": "backgrounds/73.jpg"}, {"section": "第四册目录", "title": "长歌行", "dynasty": "汉", "author": "汉乐府", "text": "青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲！", "audio": "audio/74.mp3", "background": "backgrounds/74.jpg"}, {"section": "第四册目录", "title": "江上渔者", "dynasty": "宋", "author": "范仲淹", "text": "江上往来人，但爱鲈鱼美。\n君看一叶舟，出没风波里。", "audio": "audio/75.mp3", "background": "backgrounds/75.jpg"}],$=x=>document.getElementById(x),a=$('audio');let idx=Math.min(+(localStorage.v51i
